<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PineAlert · Login</title>
  <link rel="stylesheet" href="/style.css">
  <style>
    body { display: grid; place-items: center; min-height: 100vh; padding: 16px; }
    form { width: 320px; max-width: 100%; }
  </style>
</head>
<body>
  <form class="card" method="post" action="/login">
    <div class="brand" style="margin-bottom:8px"><span class="logo">▲</span> PineAlert</div>
    <label for="pw">Password</label>
    <input id="pw" name="password" type="password" autofocus required>
    <div class="err-text" id="err" hidden>Wrong password.</div>
    <div class="actions"><button class="primary" type="submit">Log in</button></div>
  </form>
  <script>if (location.search.includes('e=1')) document.getElementById('err').hidden = false;</script>
</body>
</html>

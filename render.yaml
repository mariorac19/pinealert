# Render settings for PineAlert (free plan, Frankfurt so Binance data works).
services:
  - type: web
    name: pinealert
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install
    startCommand: node server.mjs
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: SCRIPTS_DIR
        value: "."
      - key: DATA_DIR
        value: "data"
      - key: APP_PASSWORD
        sync: false
      - key: TELEGRAM_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: OANDA_TOKEN        # free OANDA practice account -> forex, gold, indices
        sync: false
      - key: GITHUB_TOKEN       # saves alerts/scripts to a private repo (survives restarts)
        sync: false
      - key: GITHUB_DATA_REPO   # e.g. mariorac19/pinealert-data
        sync: false
